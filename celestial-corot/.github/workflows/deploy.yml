yaml
name: Deploy Starlight to Pages

on:
  push:
    branches: [ main ] # Change this to 'master' if your default branch uses that name
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  build:
    name: Build Starlight Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/configure-pages@v5

      - name: Install Node.js dependencies
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm # Change to pnpm or yarn if you use those managers

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4